[project]
name = "universal-model-loader"
version = "1.0.7"
description = "Universal ComfyUI model loader for checkpoints, diffusers, diffusion models, UNet, GGUF, dual CLIP outputs and dual VAE outputs with dynamic UI."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [
    { name = "Zoltar358", email = "zoltar@post.pl" },
]
keywords = ["ComfyUI", "custom-node", "model-loader", "checkpoint", "diffusers", "unet", "gguf", "clip", "vae"]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Zoltar358-ComfyUI/ComfyUI-Universal-Model-Loader"
Documentation = "https://github.com/Zoltar358-ComfyUI/ComfyUI-Universal-Model-Loader#readme"
"Bug Tracker" = "https://github.com/Zoltar358-ComfyUI/ComfyUI-Universal-Model-Loader/issues"

[tool.comfy]
PublisherId = "zoltar358-comfyui"
DisplayName = "ComfyUI Universal Model Loader"
Icon = "https://raw.githubusercontent.com/Zoltar358-ComfyUI/ComfyUI-Universal-Model-Loader/main/assets/icon.svg"
Banner = "https://raw.githubusercontent.com/Zoltar358-ComfyUI/ComfyUI-Universal-Model-Loader/main/assets/banner.svg"
